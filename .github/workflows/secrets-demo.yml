name: Secrets demo
on: workflow_dispatch
permissions:
  contents: read
jobs:
  repo-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Use repo secret
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          echo "length=${#API_TOKEN}"
          echo "direct=$API_TOKEN"
          echo "encoded=$(echo "$API_TOKEN" | base64)"
  prod-secret:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Use environment secret
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: echo "length=${#DEPLOY_KEY}"