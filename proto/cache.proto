syntax = "proto3";

package cache;

option go_package = "CacheProject/proto";

service CacheService {
    rpc Get(GetRequest) returns (GetResponse);
    rpc Set(SetRequest) returns (SetResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
    rpc Stats(StatsRequest) returns (StatsResponse);
}

message GetRequest {
    string key = 1;
}

message GetResponse {
    bytes value = 1;
    bool  found = 2;
}

message SetRequest {
    string key   = 1;
    bytes  value = 2;
}

message SetResponse {}

message DeleteRequest {
    string key = 1;
}

message DeleteResponse {
    bool deleted = 1;
}

message StatsRequest {}

message StatsResponse {
    int64 hits        = 1;
    int64 misses      = 2;
    int64 evictions   = 3;
    int64 currentSize = 4;
}